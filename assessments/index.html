<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Science assessment bank</title><link rel="stylesheet" href="bank.css"></head>
<body><header><div><a href="../">Computing scheme of learning</a><h1>Computer Science assessment bank</h1></div></header>
<main><div id="status" role="status">Loading questions…</div>
<form id="builder" hidden><div class="grid"><label>Specification<select id="spec"><option value="GCSE">GCSE · OCR J277</option><option value="A Level">A Level · OCR H446</option></select></label>
<label>Assessment scope<select id="scope"><option value="lesson">Lesson</option><option value="unit">Whole unit</option><option value="paper">Paper practice</option></select></label>
<label>Paper<select id="component"></select></label><label id="unitField">Unit<select id="unit"></select></label><label id="lessonField">Lesson<select id="lesson"></select></label>
<label>Mode<select id="mode"><option value="practice">Practice</option><option value="summative">Summative assessment</option></select></label></div>
<section id="mix"><label class="inline"><input type="checkbox" id="cum"> Include questions from earlier lessons</label><div id="history" hidden><p>Tick lessons your class has already covered. The headings follow the specification, so you can use your own teaching order.</p><div id="past"></div></div></section>
<p id="summary" role="status"></p><button id="build" type="submit">Start practice</button></form>
<details id="networkActivity" hidden><summary>Year 11 Network Threats · original practice and 20-mark final</summary></details>
<section id="session" hidden><div class="actions"><button id="back" type="button">← Change selection</button></div><p id="meta"></p><h2 id="sessionTitle"></h2><p id="instructions"></p><div id="items"></div><div class="actions"><button id="download">Download responses</button><button id="print">Print</button></div></section>
</main><script src="app.js"></script></body></html>
